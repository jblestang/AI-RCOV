name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy", targets: wasm32-unknown-unknown }
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo check -p radar-web --target wasm32-unknown-unknown
      - run: rustc --edition=2021 -O benchmark/standalone/main.rs -o /tmp/radial-bench
      - run: RADAR_BENCH_CELL_M=180 RADAR_BENCH_ITERATIONS=1 /tmp/radial-bench
