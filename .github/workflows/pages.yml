name: WebAssembly Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RADAR_API_URL: ${{ vars.RADAR_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: taiki-e/install-action@wasm-bindgen-cli
      - run: cargo build --release -p radar-web --target wasm32-unknown-unknown
      - run: mkdir -p dist/pkg
      - run: wasm-bindgen --target web --out-dir dist/pkg target/wasm32-unknown-unknown/release/radar_web.wasm
      - run: cp crates/radar-web/index.html dist/index.html
      - run: sed -i "s#name=\"radar-api-url\" content=\"\"#name=\"radar-api-url\" content=\"${RADAR_API_URL}\"#" dist/index.html
      - run: sed -i 's#</body>#<script type="module">import init from "./pkg/radar_web.js";init();</script></body>#' dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
