<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="radar-api-url" content=""><title>Radial</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#e9f1f4;background:#071116}*{box-sizing:border-box}body{margin:0;background:#071116}header{height:68px;display:flex;align-items:center;padding:0 22px;border-bottom:1px solid #29404a}.brand{letter-spacing:.14em;color:#9fe8d7;font-weight:750}.dot{width:9px;height:9px;border-radius:50%;background:#5fe1b9;box-shadow:0 0 15px #5fe1b9;margin-right:11px}.status{margin-left:auto;color:#83a4af;font-size:12px}.layout{display:grid;grid-template-columns:340px 1fr;min-height:calc(100vh - 68px)}aside{padding:20px;border-right:1px solid #29404a;background:#0a171d}.eyebrow{font-size:11px;letter-spacing:.16em;color:#7195a1;text-transform:uppercase;margin-top:18px}.card{background:#10232b;border:1px solid #29444e;border-radius:12px;padding:14px;margin:10px 0}.radar-name{font-weight:700}.meta,.error{font-size:12px;color:#83a4af;margin-top:5px}.error{color:#ff9c8e}label{display:block;font-size:13px;margin-top:12px}select,input,button{width:100%;border-radius:8px;padding:10px;margin-top:5px}select,input{background:#0b191f;color:#e9f1f4;border:1px solid #34505b}button{border:0;background:#51d1ad;color:#06201a;font-weight:700}.map{position:relative;overflow:hidden;background-color:#0b1b22;background-image:linear-gradient(#18313a 1px,transparent 1px),linear-gradient(90deg,#18313a 1px,transparent 1px);background-size:45px 45px}.terrain{position:absolute;inset:12%;border-radius:48% 52% 58% 42%;background:#152c32;transform:rotate(-9deg);border:1px solid #29454d}.range{position:absolute;width:42vmin;height:42vmin;left:29%;top:20%;border:1px solid #54dcb8;border-radius:50%;background:#4ad5ae15;box-shadow:inset 0 0 45px #4ad5ae16}.pin{position:absolute;left:49%;top:47%;width:12px;height:12px;border-radius:50%;background:#79f2cf;box-shadow:0 0 0 7px #79f2cf25,0 0 24px #79f2cf}.legend{position:absolute;right:18px;bottom:18px;background:#09171ddd;border:1px solid #29444e;border-radius:10px;padding:12px;font-size:12px}.bar{height:8px;width:170px;background:linear-gradient(90deg,#17343c,#52d5b1,#f2be69);border-radius:5px;margin-top:8px}@media(max-width:760px){.layout{grid-template-columns:1fr}.map{min-height:500px}aside{border-right:0}}
</style></head><body>
<header><span class="dot"></span><span class="brand">RADIAL</span><span class="status"><span id="api-status">Connexion…</span> · <span id="api-origin"></span></span></header>
<main class="layout"><aside><div class="eyebrow">Radars</div><div id="radar-list"><div class="card">Chargement…</div></div><p id="ui-error" class="error" role="alert"></p>
<button id="refresh">Actualiser</button><div class="eyebrow">Affichage</div>
<label for="resolution">Résolution</label><select id="resolution"><option>30 m</option><option selected>90 m</option><option>180 m</option></select>
<label for="height">Hauteur cible</label><select id="height"><option>Sol</option><option>30 m AGL</option><option selected>50 m AGL</option><option>100 m AGL</option><option>Personnalisée</option></select>
<label for="layer">Couche WMTS</label><select id="layer"><option>ground</option><option>agl-30m</option><option>agl-50m</option><option>agl-100m</option><option>min-detection-height</option><option selected>radar-count</option></select>
</aside><section class="map" aria-label="Carte de couverture"><div class="terrain"></div><div class="range"></div><span class="pin"></span><div class="legend">Nombre de radars couvrants<div class="bar"></div></div></section></main>
</body></html>
